<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHIRTX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#08090d;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.panel{
  width:100%;
  max-width:390px;
  background:#11131a;
  border:1px solid #292d38;
  border-radius:22px;
  padding:22px;
  box-shadow:0 0 35px rgba(0,0,0,.6);
}

.logo{
  width:78px;
  height:78px;
  border-radius:20px;
  margin:auto;
  display:block;
  object-fit:cover;
  border:2px solid #333844;
}

h1{
  text-align:center;
  margin-top:13px;
  font-size:25px;
}

.sub{
  text-align:center;
  color:#858b99;
  font-size:13px;
  margin-top:5px;
  margin-bottom:22px;
}

.section{
  font-size:13px;
  color:#858b99;
  margin-bottom:9px;
}

.option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#191c24;
  border:1px solid #282d38;
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
}

.option span{
  font-weight:bold;
}

.toggle{
  width:45px;
  height:25px;
  border:0;
  border-radius:20px;
  background:#343945;
  position:relative;
  cursor:pointer;
}

.toggle::after{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  left:3px;
  top:3px;
  transition:.2s;
}

.toggle.active{
  background:#39d98a;
}

.toggle.active::after{
  left:23px;
}

.sliderBox{
  background:#191c24;
  border:1px solid #282d38;
  border-radius:14px;
  padding:15px;
  margin-top:4px;
}

.sliderTop{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

input[type=range]{
  width:100%;
}

.mainBtn{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#ffffff;
  color:#090a0d;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.mainBtn:active{
  transform:scale(.97);
}

.status{
  text-align:center;
  color:#777d89;
  font-size:12px;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="panel">

  <img class="logo"
       src="IMG_20260923_085945.png"
       alt="SHIRTX">

  <h1>SHIRTX</h1>
  <div class="sub">CONTROL PANEL</div>

  <div class="section">FUNCTIONS</div>

  <div class="option">
    <span>Precisão</span>
    <button class="toggle" onclick="toggle(this)"></button>
  </div>

  <div class="option">
    <span>Controle de Recuo</span>
    <button class="toggle" onclick="toggle(this)"></button>
  </div>

  <div class="option">
    <span>Otimizar Touch</span>
    <button class="toggle" onclick="toggle(this)"></button>
  </div>

  <div class="option">
    <span>Modo FPS</span>
    <button class="toggle" onclick="toggle(this)"></button>
  </div>

  <div class="section" style="margin-top:18px;">
    SENSIBILIDADE
  </div>

  <div class="sliderBox">
    <div class="sliderTop">
      <span>Precisão</span>
      <b id="value">50</b>
    </div>

    <input
      type="range"
      min="0"
      max="100"
      value="50"
      oninput="valueChange(this.value)"
    >
  </div>

  <button class="mainBtn" onclick="activate()">
    ATIVAR PAINEL
  </button>

  <div class="status" id="status">
    Status: aguardando
  </div>

</div>

<script>
function toggle(button){
  button.classList.toggle("active");
}

function valueChange(value){
  document.getElementById("value").textContent=value;
}

function activate(){
  const status=document.getElementById("status");
  status.textContent="Status: ativado";

  setTimeout(()=>{
    status.textContent="Status: aguardando";
  },3000);
}
</script>

</body>
</html>
